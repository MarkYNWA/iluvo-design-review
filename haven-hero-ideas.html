sthead, larger wordmark and precise typography.','A compact ivory logo plaque over the photograph. A distinctive brand stamp.','ILUVO and the brand promise, without Energy. A larger, simpler identity.','A centred master-brand wordmark with the brand promise. No Energy label.'];function show(){let i=select.value;let url='hero-preview.html?design=4&palette=&logo=owner-01-continuity.svg&embed=1&idea='+i;document.querySelector('#preview').src=url;document.querySelector('#full').href=url;document.querySelector('#note').textContent=notes[i-1]+' Home or business is chosen after clicking.';history.replaceState(null,'','?idea='+i)}select.value=['1','2','3','4','5','6','7','8','9'].includes(new URLSearchParams(location.search).get('idea'))?new URLSearchParams(location.search).get('idea'):'4';select.onchange=show;show();</script></body></html>
